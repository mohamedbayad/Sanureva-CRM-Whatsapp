name: Sanureva Preview Data Path Smoke Temp
on:
  push:
    branches: [feature/neon-snapshot-fallback-20261009]
    paths: [.github/workflows/sanureva-page-path-smoke-temp.yml]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read-only runtime and access boundary verification
        env:
          SITE: https://sanureva-crm-whatsapp-5gui4pt64-mohamedbayads-projects.vercel.app
        shell: bash
        run: |
          set -eu
          for route in /api/neon-review-summary /api/neon-health; do
            code=$(curl -sS --max-time 25 -o /tmp/response.json -w '%{http_code}' "$SITE$route")
            echo "$route HTTP $code"
            test "$code" = "200"
            if [ "$route" = /api/neon-review-summary ]; then
              node -e 'const a=require("node:fs").readFileSync("/tmp/response.json","utf8");const j=JSON.parse(a);const q=j.page_qa||{};console.log("PAGE_QA",JSON.stringify(q));if(!j.ok||j.writes_enabled!==false||!q.checks) process.exit(1);if(!q.ok) process.exitCode=2;'
            else
              node -e 'const j=JSON.parse(require("node:fs").readFileSync("/tmp/response.json","utf8"));if(!j.ok||j.permissions?.readonly_verified!==true)process.exit(1);console.log("PREVIEW DB",JSON.stringify(j.counts));'
            fi
          done
          for route in /api/snapshot /api/neon-page-qa /api/media; do
            code=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$SITE$route")
            echo "$route anonymous HTTP $code"
            test "$code" = "401"
          done
          for route in / /orders /inbox; do
            code=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$SITE$route")
            echo "$route anonymous HTTP $code"
            test "$code" = "307" || test "$code" = "308"
          done

name: Sanureva Preview Login Media Integration TEMP
on:
  push:
    branches: [feature/neon-snapshot-fallback-20261009]
    paths: [.github/workflows/sanureva-preview-auth-media-e2e-temp.yml]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify real Preview Login and signed media handler
        env:
          SITE: https://sanureva-crm-whatsapp-6g61b4d0v-mohamedbayads-projects.vercel.app
        shell: bash
        run: |
          set -eu
          status=000
          for i in $(seq 1 32); do
            status=$(curl -sS --max-time 25 -o /tmp/preview-qa-response.json -w "%{http_code}" "$SITE/api/neon-review-summary?probe_media=1" || true)
            if [ "$status" = "200" ]; then break; fi
            echo "Preview initializing, HTTP $status"
            sleep 4
          done
          echo "PROBE_STATUS $status"
          test "$status" = "200"
          node -e '
            const j=JSON.parse(require("node:fs").readFileSync("/tmp/preview-qa-response.json","utf8"));
            const probe=j.preview_e2e_probe||{};
            console.log("APP_LOGIN_QA",JSON.stringify(probe.login||{}));
            console.log("APP_PAGE_AUTH_QA",JSON.stringify(probe.authenticated_pages||{}));
            console.log("APP_ORIGINAL_MEDIA_QA",JSON.stringify(probe.media||{}));
            console.log("APP_QA_OUTCOME",JSON.stringify({ok:probe.ok,pageDataOk:j.page_qa?.ok,source:j.page_qa?.source,reason:probe.reason||null}));
            if(!j.ok||j.writes_enabled!==false||!probe.ok||!j.page_qa?.ok) process.exit(2);
          '
          for route in /api/snapshot /api/media /api/neon-page-qa; do
            status=$(curl -sS --max-time 25 -o /dev/null -w "%{http_code}" "$SITE$route")
            echo "NO_SESSION $route HTTP $status"
            test "$status" = "401"
          done

name: Neon Snapshot PR Validation
on:
  push:
    branches:
      - feature/neon-snapshot-fallback-20261009
    paths:
      - package.json
      - package-lock.json
      - lib/neon-snapshot.ts
      - lib/n8n.ts
      - .github/workflows/neon-snapshot-pr.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate consistent npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact dependency tree
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
      - name: Commit generated lockfile to feature branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync Neon dependency lockfile"
            git push
          fi
